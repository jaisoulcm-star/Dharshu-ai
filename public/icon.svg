<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="160" fill="url(#avatar)" opacity="0.2" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#avatar)" stroke-width="8" opacity="0.6"/>
  <!-- Dharshu Mascot Face/Icon -->
  <g transform="translate(156, 156)">
    <circle cx="100" cy="100" r="85" fill="url(#avatar)"/>
    <!-- Cute Eyes -->
    <circle cx="70" cy="90" r="12" fill="#0f172a"/>
    <circle cx="130" cy="90" r="12" fill="#0f172a"/>
    <circle cx="74" cy="86" r="4" fill="#ffffff"/>
    <circle cx="134" cy="86" r="4" fill="#ffffff"/>
    <!-- Cute Smile -->
    <path d="M 75 120 Q 100 145 125 120" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
    <!-- Sparkles -->
    <path d="M 20 40 Q 30 40 30 30 Q 30 40 40 40 Q 30 40 30 50 Q 30 40 20 40 Z" fill="#f472b6"/>
    <path d="M 160 30 Q 170 30 170 20 Q 170 30 180 30 Q 170 30 170 40 Q 170 30 160 30 Z" fill="#c084fc"/>
  </g>
</svg>
